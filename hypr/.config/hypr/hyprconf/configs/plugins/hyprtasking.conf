# hyprtasking workspace overview plugin
# Docs: https://github.com/raybbian/hyprtasking

plugin {
    hyprtasking {
        layout = grid

        gap_size = 10
        bg_color = 0xff26233a
        border_size = 2
        exit_on_hovered = false
        warp_on_move_window = 1

        drag_button = 0x110   # left mouse button
        select_button = 0x111 # right mouse button

        jump = {
            enabled = false
            label_color = 0xffffffff
            label_background = 0x000000cc
            label_size = 32
        }

        gestures = {
            enabled = true
            move_fingers = 3
            move_distance = 300
            open_fingers = 4
            open_distance = 300
            open_positive = true
        }

        grid = {
            rows = 3
            cols = 3
            loop = false
            layers = 2
            loop_layers = true
            gaps_use_aspect_ratio = true
        }

        linear = {
            top = false
            height = 400
            scroll_speed = 1.0
            blur = false
        }
    }
}
